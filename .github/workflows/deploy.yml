name: Deploy

on:
  # main への push（＝PR のマージ）でデプロイする。
  push:
    branches: ["main"]
  # 手動での再デプロイ・ロールバック用。
  workflow_dispatch:

# デプロイは途中で止めない（cancel-in-progress: false）。
# 走っている最中に新しい main が来たら、キューに積んで順に流す。
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Cloudflare Workers
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        # bun のバージョンは .bun-version から自動検出される

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # 壊れたものを本番へ出さない。PR Check と同じ関門をここでも通す
      # （main への直 push や、マージ後に初めて壊れる組み合わせを拾うため）。
      - name: Check (tsgo + oxlint + oxfmt)
        run: bun run check

      - name: Test
        run: bun run test

      # env.ts は import.meta.env を読むので、VITE_* はビルド時に焼き込まれる。
      # Worker 側の runtime secret ではなく、ここで渡す必要がある。
      - name: Build
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_APP_TITLE: ${{ vars.VITE_APP_TITLE }}
          VITE_APP_URL: ${{ vars.VITE_APP_URL }}

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # ビルドは前のステップで済ませてあるので、ここは deploy だけ。
          command: deploy
          packageManager: bun
